<style>
  /* 픽세라 브랜드 컬러 가이드: 퍼플 #6551D9 · 라벤더 #DDD5F3 · 화이트 #FFFFFF · 라임 #CFFF3D(소량) · 차콜 #302E35 */
  :root {
    --bg: #F7F5FB;
    --surface: #FFFFFF;
    --surface2: #EFEBF8;
    --ink: #302E35;
    --muted: #6E687F;
    --line: #E3DDF2;
    --accent: #6551D9;
    --accent-soft: #EAE5F9;
    --lime: #CFFF3D;
    --lime-ink: #302E35;
    --warn: #A16207;
    --warn-soft: #FBF3DF;
    --danger: #B3403A;
    --danger-soft: #F9E9E8;
    --chip-branch: #EFEBF8;
    --chip-branch-ink: #5A4BBE;
    --chip-hq: #E9E8EC;
    --chip-hq-ink: #302E35;
    --chip-joint: #DDD5F3;
    --chip-joint-ink: #46389E;
    --shadow: 0 1px 3px rgba(48,46,53,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #211F28;
      --surface: #2A2833;
      --surface2: #34313F;
      --ink: #EAE7F1;
      --muted: #A29CB4;
      --line: #3E3A4C;
      --accent: #9F8FF2;
      --accent-soft: #37305A;
      --lime: #CFFF3D;
      --lime-ink: #302E35;
      --warn: #E2B45E;
      --warn-soft: #332A0F;
      --danger: #E08983;
      --danger-soft: #3A1F1D;
      --chip-branch: #322D4A;
      --chip-branch-ink: #C3B8F5;
      --chip-hq: #33323A;
      --chip-hq-ink: #D6D4DC;
      --chip-joint: #3B3357;
      --chip-joint-ink: #CFC4F8;
      --shadow: none;
    }
  }
  :root[data-theme="light"] {
    --bg: #F7F5FB; --surface: #FFFFFF; --surface2: #EFEBF8;
    --ink: #302E35; --muted: #6E687F; --line: #E3DDF2;
    --accent: #6551D9; --accent-soft: #EAE5F9;
    --lime: #CFFF3D; --lime-ink: #302E35;
    --warn: #A16207; --warn-soft: #FBF3DF;
    --danger: #B3403A; --danger-soft: #F9E9E8;
    --chip-branch: #EFEBF8; --chip-branch-ink: #5A4BBE;
    --chip-hq: #E9E8EC; --chip-hq-ink: #302E35;
    --chip-joint: #DDD5F3; --chip-joint-ink: #46389E;
    --shadow: 0 1px 3px rgba(48,46,53,.08);
  }
  :root[data-theme="dark"] {
    --bg: #211F28; --surface: #2A2833; --surface2: #34313F;
    --ink: #EAE7F1; --muted: #A29CB4; --line: #3E3A4C;
    --accent: #9F8FF2; --accent-soft: #37305A;
    --lime: #CFFF3D; --lime-ink: #302E35;
    --warn: #E2B45E; --warn-soft: #332A0F;
    --danger: #E08983; --danger-soft: #3A1F1D;
    --chip-branch: #322D4A; --chip-branch-ink: #C3B8F5;
    --chip-hq: #33323A; --chip-hq-ink: #D6D4DC;
    --chip-joint: #3B3357; --chip-joint-ink: #CFC4F8;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---------- 비밀번호 문 ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .gate-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow);
    padding: 36px 32px; width: 100%; max-width: 380px; text-align: center;
  }
  .gate-card h1 { font-size: 19px; margin: 14px 0 4px; }
  .gate-card p { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
  .gate-card input {
    width: 100%; padding: 11px 14px; font-size: 16px;
    border: 1.5px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--ink);
    text-align: center; letter-spacing: .35em; font-variant-numeric: tabular-nums;
  }
  .gate-card input:focus { outline: none; border-color: var(--accent); }
  .gate-card button {
    width: 100%; margin-top: 12px; padding: 11px;
    font-size: 15px; font-weight: 700; letter-spacing: .02em;
    background: var(--accent); color: #fff; border: none; border-radius: 9px; cursor: pointer;
  }
  .gate-card button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #gate-err { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 10px; }

  /* ---------- 픽셀 로고 ---------- */
  .pxgrid {
    display: grid; grid-template-columns: repeat(7, 7px); grid-auto-rows: 7px;
    gap: 2px; width: max-content; margin: 0 auto;
  }
  .pxgrid.inline { margin: 0; }
  .pxgrid i { border-radius: 1px; background: var(--line); }
  .pxgrid i.on { background: var(--accent); }

  /* ---------- 머리글 ---------- */
  header.board { margin-bottom: 26px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: .16em;
    color: var(--accent); text-transform: uppercase;
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  h1.branch { font-size: 30px; margin: 0 0 2px; letter-spacing: -.01em; text-wrap: balance; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

  .total-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 16px 18px;
  }
  .total-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .total-label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .total-num { font-size: 26px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .total-num small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .bar { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width .35s ease; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

  .legend {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;
    font-size: 12px; color: var(--muted);
  }

  /* ---------- 딱지(칩) ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .01em;
    padding: 2px 9px; border-radius: 99px; white-space: nowrap;
  }
  .chip.branch { background: var(--chip-branch); color: var(--chip-branch-ink); }
  .chip.hq     { background: var(--chip-hq);     color: var(--chip-hq-ink); }
  .chip.joint  { background: var(--chip-joint);  color: var(--chip-joint-ink); }
  .chip.legal  { background: var(--warn-soft);   color: var(--warn); }
  .chip.deadline { background: var(--danger-soft); color: var(--danger); }
  .chip.ongoing  { background: var(--lime); color: var(--lime-ink); }

  /* ---------- 구간 ---------- */
  section.period {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); margin-top: 18px; overflow: hidden;
  }
  .period-head {
    padding: 15px 18px 13px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .period-dday {
    font-size: 12px; font-weight: 800; letter-spacing: .06em;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 7px; font-variant-numeric: tabular-nums;
  }
  .period-title { font-size: 16.5px; font-weight: 800; margin: 0; flex: 1; min-width: 140px; }
  .period-count { font-size: 13px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .period-bar { height: 4px; background: var(--surface2); }
  .period-bar > i { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .35s ease; }
  @media (prefers-reduced-motion: reduce) { .period-bar > i { transition: none; } }

  /* ---------- 항목 ---------- */
  ul.items { list-style: none; margin: 0; padding: 4px 0; }
  li.item { border-bottom: 1px solid var(--line); }
  li.item:last-child { border-bottom: none; }
  .item-label {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 13px 18px; cursor: pointer;
  }
  .item-label:hover { background: var(--surface2); }
  .item input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 21px; height: 21px; flex: none; margin-top: 2px;
    border: 2px solid var(--muted); border-radius: 6px;
    background: var(--surface); cursor: pointer; position: relative;
  }
  .item input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .item input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 5.5px; top: 1.5px;
    width: 5px; height: 10px; border: solid #fff; border-width: 0 2.5px 2.5px 0;
    transform: rotate(43deg);
  }
  .item input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 14.5px; font-weight: 700; }
  .item.done .item-name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .item-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .item-note { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .item-date { font-size: 11.5px; color: var(--accent); font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* ---------- 순서 사슬 안내 ---------- */
  .chain {
    margin: 10px 18px 14px; padding: 11px 14px;
    background: var(--surface2); border-radius: 9px;
    font-size: 12.5px; color: var(--muted);
  }
  .chain b { color: var(--ink); }
  .chain .steps { margin-top: 4px; line-height: 1.9; }
  .chain .steps span {
    background: var(--surface); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 6px; white-space: nowrap;
    font-weight: 600; color: var(--ink); font-size: 12px;
  }
  .chain .steps em { font-style: normal; color: var(--accent); font-weight: 800; padding: 0 3px; }

  /* ---------- 바닥글 ---------- */
  footer.board {
    margin-top: 26px; padding: 18px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow);
  }
  footer.board h2 { font-size: 14px; margin: 0 0 6px; }
  footer.board p { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
  #report-btn {
    padding: 10px 18px; font-size: 14px; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 9px; cursor: pointer;
  }
  #report-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #report-msg { font-size: 12.5px; margin-top: 10px; color: var(--muted); min-height: 18px; }
  #report-fallback {
    display: none; width: 100%; margin-top: 10px; height: 180px;
    font-size: 12px; font-family: ui-monospace, Consolas, monospace;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px;
  }

  #board { display: none; }
</style>

<div id="gate">

</div>

<div class="wrap" id="board">
  <header class="board">

    <div class="total-box">
      <div class="total-row">

        <span class="chip deadline">⏰ 마감선</span>
        <span class="chip ongoing">⟶ 이어지는 항목</span>
      </div>
    </div>
  </header>

  <div id="sections"></div>

  <footer class="board">
    <h2>진행 상황 본사에 보내기</h2>
    <p>체크 내용은 이 기기(브라우저)에만 저장됩니다. 아래 단추를 누르면 진행 보고 글이 복사됩니다 — 카톡·메일에 붙여 넣어 본사로 보내 주세요.</p>
    <button id="report-btn" type="button">진행 보고 복사하기</button>
    <div id="report-msg"></div>
    <textarea id="report-fallback" readonly aria-label="진행 보고 내용"></textarea>
  </footer>
</div>

        { id: "privacy",   who: "branch", name: "개인정보 처리방침·동의서 비치 확인", note: "본사 표준 양식" },

  var WHO = {
    branch: { cls: "branch", label: "🏠 지점" },

    joint:  { cls: "joint",  label: "🤝 공동" }
  };

  /* ---------- 픽셀 로고 (픽세라 공식 7×7) ---------- */
  var LOGO = [
    "1110111",
    "1011001",
    "1101101",
    "0110110",
    "1011011",
    "1001101",
    "1110111"
  ];
  function drawLogo(el) {
    if (!el) return;
    for (var r = 0; r < 7; r++) {
      for (var c = 0; c < 7; c++) {
        var i = document.createElement("i");
        if (LOGO[r].charAt(c) === "1") i.className = "on";
        el.appendChild(i);
      }
    }
  }
  drawLogo(document.getElementById("gate-logo"));
  drawLogo(document.getElementById("head-logo"));

  /* ---------- 저장 ---------- */
  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveState(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
  }
  var state = loadState();

  /* ---------- 비밀번호 문 ---------- */
  /* 순수 JS SHA-256 — 보안 연결(https)이 아닌 환경에서 crypto.subtle이 없을 때 예비용 */
  function sha256js(text) {
    var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
             0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
             0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
             0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
             0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
             0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
             0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
             0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var bytes = Array.prototype.slice.call(new TextEncoder().encode(text));
    var bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (var i = 7; i >= 0; i--) bytes.push((i >= 4 ? 0 : (bitLen / Math.pow(2, i * 8))) & 0xff);
    function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
    var w = new Array(64);
    for (var p = 0; p < bytes.length; p += 64) {
      for (var t = 0; t < 16; t++) {
        w[t] = (bytes[p+t*4] << 24) | (bytes[p+t*4+1] << 16) | (bytes[p+t*4+2] << 8) | bytes[p+t*4+3];
      }
      for (t = 16; t < 64; t++) {
        var s0 = rotr(w[t-15], 7) ^ rotr(w[t-15], 18) ^ (w[t-15] >>> 3);
        var s1 = rotr(w[t-2], 17) ^ rotr(w[t-2], 19) ^ (w[t-2] >>> 10);
        w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (t = 0; t < 64; t++) {
        var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K[t] + w[t]) | 0;
        var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
    }
    return H.map(function (x) { return (x >>> 0).toString(16).padStart(8, "0"); }).join("");
  }
  function sha256hex(text) {
    if (window.crypto && crypto.subtle) {
      var data = new TextEncoder().encode(text);
      return crypto.subtle.digest("SHA-256", data).then(function (buf) {
        var arr = Array.prototype.slice.call(new Uint8Array(buf));
        return arr.map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      });
    }
    return Promise.resolve(sha256js(text));
  }
  function openBoard() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("board").style.display = "block";
  }
  var unlocked = false;
  try { unlocked = sessionStorage.getItem("pxr-gate-ok") === "1"; } catch (e) {}
  if (unlocked) openBoard();
  else document.getElementById("gate-pw").focus();

  document.getElementById("gate-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = document.getElementById("gate-pw").value.trim();
    sha256hex(pw).then(function (hex) {
      if (hex === PW_HASH) {
        try { sessionStorage.setItem("pxr-gate-ok", "1"); } catch (e) {}
        openBoard();
      } else {
        document.getElementById("gate-err").textContent = "비밀번호가 맞지 않습니다.";
        document.getElementById("gate-pw").value = "";
        document.getElementById("gate-pw").focus();
      }
    });
  });

  /* ---------- 그리기 ---------- */
  function fmtDate(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate();
  }

  var sectionsEl = document.getElementById("sections");

  SECTIONS.forEach(function (sec) {
    var section = document.createElement("section");
    section.className = "period";
    section.id = "sec-" + sec.id;

    var head = document.createElement("div");
    head.className = "period-head";
    head.innerHTML =
      '<span class="period-dday">' + sec.dday + '</span>' +
      '<h2 class="period-title">' + sec.title + '</h2>' +
      '<span class="period-count" id="count-' + sec.id + '"></span>';
    section.appendChild(head);

    var bar = document.createElement("div");
    bar.className = "period-bar";
    bar.innerHTML = '<i id="bar-' + sec.id + '"></i>';
    section.appendChild(bar);

    var ul = document.createElement("ul");
    ul.className = "items";

    sec.items.forEach(function (item) {
      var li = document.createElement("li");
      li.className = "item";
      li.id = "item-" + item.id;

      var chips = '<span class="chip ' + WHO[item.who].cls + '">' + WHO[item.who].label + "</span>";
      if (item.legal)    chips += '<span class="chip legal">⚖️ 전문가 확인</span>';
      if (item.deadline) chips += '<span class="chip deadline">⏰ 마감선 ' + item.deadline + "</span>";
      if (item.ongoing)  chips += '<span class="chip ongoing">⟶ 이어지는 항목</span>';

      li.innerHTML =
        '<label class="item-label">' +
          '<input type="checkbox" data-id="' + item.id + '" aria-label="' + item.name + '" />' +
          '<div class="item-body">' +
            '<div class="item-name">' + item.name + "</div>" +
            '<div class="item-chips">' + chips + "</div>" +
            (item.note ? '<div class="item-note">' + item.note + "</div>" : "") +
            '<div class="item-date" id="date-' + item.id + '"></div>' +
          "</div>" +
        "</label>";
      ul.appendChild(li);
    });
    section.appendChild(ul);

    if (sec.chain) {
      var chain = document.createElement("div");
      chain.className = "chain";
      chain.innerHTML =
        "<b>" + sec.chain.label + "</b>" +
        '<div class="steps">' +
        sec.chain.steps.map(function (s) { return "<span>" + s + "</span>"; }).join("<em>→</em>") +
        "</div>";
      section.appendChild(chain);
    }

    sectionsEl.appendChild(section);
  });

  function refresh() {
    var total = 0, done = 0;
    SECTIONS.forEach(function (sec) {
      var secTotal = sec.items.length, secDone = 0;
      sec.items.forEach(function (item) {
        var ts = state[item.id];
        var li = document.getElementById("item-" + item.id);
        var cb = li.querySelector("input");
        var dateEl = document.getElementById("date-" + item.id);
        if (ts) {
          secDone++;
          li.classList.add("done");
          cb.checked = true;
          dateEl.textContent = "완료 · " + fmtDate(ts);
        } else {
          li.classList.remove("done");
          cb.checked = false;
          dateEl.textContent = "";
        }
      });
      total += secTotal; done += secDone;
      document.getElementById("count-" + sec.id).textContent = secDone + " / " + secTotal;
      document.getElementById("bar-" + sec.id).style.width = (secTotal ? Math.round(secDone / secTotal * 100) : 0) + "%";
    });
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById("total-pct").textContent = pct;
    document.getElementById("total-count").textContent = done + " / " + total + " 완료";
    document.getElementById("total-bar").style.width = pct + "%";
  }

  sectionsEl.addEventListener("change", function (ev) {
    var cb = ev.target;
    if (!cb.matches || !cb.matches('input[type="checkbox"]')) return;
    var id = cb.getAttribute("data-id");
    if (cb.checked) state[id] = Date.now();
    else delete state[id];
    saveState(state);
    refresh();
  });

  refresh();

  /* ---------- 진행 보고 내려받기 ---------- */
  function buildReport() {
    var now = new Date();
    var stamp = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
    var lines = [];
    lines.push("# 픽세라 " + BRANCH_NAME + " 개원 준비 진행 보고");
    lines.push("");
    lines.push("- 보고일: " + stamp);
    var total = 0, done = 0;
    SECTIONS.forEach(function (sec) {
      sec.items.forEach(function (it) { total++; if (state[it.id]) done++; });
    });
    lines.push("- 전체 진행률: " + (total ? Math.round(done / total * 100) : 0) + "% (" + done + "/" + total + ")");
    lines.push("");
    SECTIONS.forEach(function (sec) {
      lines.push("## " + sec.dday + " · " + sec.title);
      sec.items.forEach(function (it) {
        if (state[it.id]) lines.push("- [x] " + it.name + " (완료 " + fmtDate(state[it.id]) + ")");
        else lines.push("- [ ] " + it.name);
      });
      lines.push("");
    });
    return { text: lines.join("\n"), stamp: stamp };
  }

  document.getElementById("report-btn").addEventListener("click", function () {
    var report = buildReport();
    var msg = document.getElementById("report-msg");
    var fallback = document.getElementById("report-fallback");
    function showFallback(note) {
      fallback.style.display = "block";
      fallback.value = report.text;
      fallback.focus();
      fallback.select();
      msg.textContent = note;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(report.text).then(function () {
        msg.textContent = "복사되었습니다. 카톡·메일에 붙여 넣어 본사로 보내 주세요.";
      }).catch(function () {
        showFallback("자동 복사가 안 되는 환경입니다. 아래 내용을 직접 복사해 주세요.");
      });
    } else {
      showFallback("아래 내용을 직접 복사해서 본사에 보내 주세요.");
    }
  });
